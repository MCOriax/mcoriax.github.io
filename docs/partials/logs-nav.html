<!--
  Shared change-log version navigation. {{ROOT}} is replaced with the page's
  relative root by js/site.js, which also marks the current page's entry and
  appends the "back" link below.

  THIS IS THE ONLY PLACE VERSIONS ARE LISTED. Publishing a release means adding
  one <li> here — every log page reads this file, so nothing else needs editing.

  Newest first. The newest entry of each product points at that product's index
  (which always mirrors the latest release) and carries the "Latest" pill; every
  older entry points at its own permalink.

  The newest entry also carries data-permalink, naming its own versioned page.
  That entry stands for two URLs — the index and the permalink — and both must
  light up as "you are here", so publishing a release means editing three things
  in this file: add an <li> for the version being superseded, and move the
  newest entry's href label and data-permalink forward.

  data-product names the product's folder under logs/, and is how site.js knows
  which index a permalink should go "back" to. The core plugin's list has no
  data-product because it lives at the root of logs/.
-->
